<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1200" viewBox="0 0 800 1200" role="img" aria-label="HairMuse pin">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c26d7f"/>
      <stop offset="1" stop-color="#ecc4c0"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="800" height="1200" fill="url(#g)"/>
  <circle cx="740" cy="130" r="230" fill="#ffffff" opacity="0.09"/>
  <circle cx="40" cy="1110" r="280" fill="#2a211b" opacity="0.07"/>
  <rect width="800" height="1200" filter="url(#grain)" opacity="0.05"/>
  <text x="400" y="92" text-anchor="middle" font-family="Georgia, serif" font-size="30" letter-spacing="10" fill="#ffffff" opacity="0.85">HAIRMUSE</text>
  <text x="400" y="372" text-anchor="middle" font-family="Verdana, sans-serif" font-size="22" letter-spacing="7" fill="#ffffff" opacity="0.8">NO HEAT</text>
  <text text-anchor="middle" font-family="Georgia, serif" font-size="72" font-weight="bold" fill="#ffffff"><tspan x="400" y="556">Heatless</tspan><tspan x="400" y="648">Curls</tspan><tspan x="400" y="740">Overnight</tspan></text>
  <line x1="330" y1="810" x2="470" y2="810" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
  <text x="400" y="1136" text-anchor="middle" font-family="Verdana, sans-serif" font-size="20" letter-spacing="6" fill="#ffffff" opacity="0.75">HAIRMUSE.COM</text>
</svg>
