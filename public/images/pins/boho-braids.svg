<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-label="HairMuse pin">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ab8152"/>
      <stop offset="1" stop-color="#e8d3ae"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#g)"/>
  <circle cx="740" cy="130" r="230" fill="#ffffff" opacity="0.09"/>
  <circle cx="40" cy="710" r="280" fill="#2a211b" opacity="0.07"/>
  <rect width="800" height="800" filter="url(#grain)" opacity="0.05"/>
  <text x="400" y="92" text-anchor="middle" font-family="Georgia, serif" font-size="30" letter-spacing="10" fill="#ffffff" opacity="0.85">HAIRMUSE</text>
  <text x="400" y="248" text-anchor="middle" font-family="Verdana, sans-serif" font-size="22" letter-spacing="7" fill="#ffffff" opacity="0.8">FESTIVAL READY</text>
  <text text-anchor="middle" font-family="Georgia, serif" font-size="72" font-weight="bold" fill="#ffffff"><tspan x="400" y="386">Boho</tspan><tspan x="400" y="478">Braids</tspan></text>
  <line x1="330" y1="548" x2="470" y2="548" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
  <text x="400" y="736" text-anchor="middle" font-family="Verdana, sans-serif" font-size="20" letter-spacing="6" fill="#ffffff" opacity="0.75">HAIRMUSE.COM</text>
</svg>
